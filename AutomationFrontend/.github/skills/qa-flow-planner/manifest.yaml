manifest_version: 1
skill: qa-flow-planner
role: planner
pipeline_step: "1-Planificar"
converted_from: .github/agents/BMO-FlowPlanner.agent.md

description: >
  Explora el flujo funcional en dispositivo/navegador real y produce un plan de
  automatización accionable (PlanStatus: Draft). No escribe código ni objetos .rs.

modes:
  - default   # única modalidad; no tiene sub-modos como qa-explorer

inputs:
  - descripcion_flujo: string
  - plataforma: enum [android, ios, web]
  - run_id: string   # formato QA-<YYYYMMDD>-<flujo-slug>, generado por qa-orchestrator

outputs:
  - context_file: .github/orchestrator/runs/<run-id>-<flujo>.md
  - plan_status: Draft

allowed_write_paths:
  - ".github/orchestrator/runs/**"   # solo archivos nuevos, nunca sobrescribir

forbidden_paths:
  - "settings/**"
  - "Include/config/**"
  - "Profiles/**"
  - "Drivers/**"
  - "Libs/internal/**"
  - "*.prj"
  - "build.gradle"
  - "package.json"

state_machine:
  field: PlanStatus
  values: [Draft, Approved, Rejected]
  owner_of_transition_to_draft: qa-flow-planner
  owner_of_transition_to_approved_or_rejected: qa-explorer   # nunca el usuario, nunca este skill

retry_policy:
  counter_field: RetryCount
  max_attempts: 3
  on_exceeded: escalate_to_user
  incremented_by: qa-explorer   # tras cada Rejected; qa-flow-planner solo lee el valor

conditional_dependencies:
  - condition: "flujo involucra eventos rads-tracker/Ads"
    requires_skill: qa-rads-tracker
    preflight: "curl -s http://127.0.0.1:8082/health"

related_skills:
  - qa-explorer        # siguiente paso obligatorio, valida y aprueba/rechaza
  - qa-rads-tracker    # condicional, si el flujo toca eventos Ads

reference_docs:
  - references/reusable-testcases.md
  - references/plan-template.md
  - path: .github/skills/katalon-mobile-automation/SKILL.md
    note: "fuente de verdad superior — prevalece en caso de conflicto"
