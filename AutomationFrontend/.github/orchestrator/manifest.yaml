manifest_version: 1
name: qa-orchestrator-pipeline
description: >
  Definición machine-readable del pipeline de 5 pasos que sigue el Agente Orquestador
  único (.claude/agents/qa-orchestrator.md). Reemplaza el modelo anterior de
  "orquestador invoca sub-agentes .agent.md" por "un solo agente consume Skills".
converted_from: .github/agents/QA-Automatizador.agent.md

# ─────────────────────────────────────────────────────────────────────────────
# Pipeline fijo — no reordenable, no saltable (excepto el retorno 5→4 en fallo)
# ─────────────────────────────────────────────────────────────────────────────
pipeline:
  - step: 1
    name: Planificar
    skill: qa-flow-planner
    produces: "context_file (PlanStatus: Draft)"
    on_complete: goto_step_2

  - step: 2
    name: Explorar
    skill: qa-explorer
    substeps:
      - name: validar
        trigger: "context_file.PlanStatus == Draft"
        outcomes:
          Approved: continue_to_captura
          Rejected: return_to_step_1_with_rejection_notes
      - name: capturar
        trigger: "context_file.PlanStatus == Approved"
        produces: "Object Repository/**/*.rs"
    retry:
      counter_field: RetryCount
      max_attempts: 3
      scope: "ciclo Planificar↔Explorar (validación de plan)"
      on_exceeded: escalate_to_user
    on_complete: goto_step_3

  - step: 3
    name: "Crear Tests"
    skill: qa-test-creator
    precondition: "context_file.PlanStatus == Approved AND ApprovedBy == qa-explorer"
    produces:
      - "Page classes (Keywords/com/rappi/page/**)"
      - "Steps classes (Keywords/com/rappi/steps/**)"
      - "Script orquestador (Scripts/**)"
      - "Test Case (.tc)"
    on_complete: goto_step_4

  - step: 4
    name: "Correr Tests"
    tool: runner_headless
    command: "bash runner/run.sh run --case <plataforma>/<TC_NAME>"
    success_criteria: "log contiene '✓ [PASSED ] <TC_NAME>'"
    note: >
      Usa el runner multiplataforma (Web + Android) de la Fase 2 del refactor —
      plataforma derivada automáticamente de Test Cases/<plataforma>/... .
    on_complete: goto_step_5

  - step: 5
    name: Validar
    decision:
      PASSED: terminar_test  # éxito — reportar y cerrar el run
      FAILED:
        skill: qa-debugger
        action: diagnosticar_y_aplicar_fix_minimo
        then: goto_step_4    # repetir "Correr Tests" con el fix aplicado
    retry:
      counter_field: RunnerRetryCount
      max_attempts: 3
      scope: "ciclo Correr↔Validar (debug/run)"
      on_exceeded: escalate_to_user

# ─────────────────────────────────────────────────────────────────────────────
# Decisiones de diseño explícitas (ver auditoría Fase 4 para el razonamiento)
# ─────────────────────────────────────────────────────────────────────────────
design_decisions:
  - id: DD-1
    decision: >
      Se eliminó el gate manual "R-K5: Katalon Studio Problems panel = 0 errors" del
      loop autónomo (existía como FASE 5B en QA-Automatizador.agent.md).
    reason: >
      Requería a un humano reportando el conteo del Problems panel del IDE gráfico de
      Katalon Studio — incompatible con un pipeline "4-Correr Tests → 5-Validar"
      totalmente autónomo, y Katalon Studio Desktop no está instalado en el entorno
      headless de este runner (ver auditoría de dependencias). Se conserva como
      recomendación manual en qa-test-creator/references/groovy-compat-rules.md.
  - id: DD-2
    decision: >
      Las fases "2A validar" y "2B capturar" del pipeline original se fusionaron en un
      solo paso "2-Explorar" con dos sub-modos dentro del mismo skill (qa-explorer).
    reason: >
      Coincide literalmente con la especificación del usuario ("2-Explorar (capturar
      objetos, crear keywords, etc.)"), y evita que el Orquestador tenga que modelar un
      sub-estado adicional — qa-explorer ya decide internamente en qué modo entrar según
      PlanStatus.
  - id: DD-3
    decision: >
      El estado del pipeline se persiste en .github/orchestrator/runs/, una ruta nueva,
      en vez de reusar .github/agents/context/orchestrator/ (legacy).
    reason: >
      .github/agents/ se preservó intacto y sin escritura nueva por regla explícita de
      la Fase 1 del refactor (rollback/referencia). El nuevo Orquestador necesita su
      propio espacio de estado para no mezclar runs del sistema viejo con el nuevo.

# ─────────────────────────────────────────────────────────────────────────────
# Comunicación entre skills — mismo mecanismo que el sistema original (archivos)
# ─────────────────────────────────────────────────────────────────────────────
communication:
  run_id_format: "QA-<YYYYMMDD>-<flujo-slug>"
  context_file: ".github/orchestrator/runs/<run-id>-<flujo>.md"
  state_fields:
    - PlanStatus: [Draft, Approved, Rejected]
    - RetryCount: int
    - RunnerRetryCount: int
    - Phase: [PLANIFICAR, EXPLORAR_VALIDAR, EXPLORAR_CAPTURAR, CREAR_TESTS, CORRER_TESTS, DEBUG, COMPLETED, FAILED]

skills_consumed:
  - qa-flow-planner
  - qa-explorer
  - qa-test-creator
  - qa-debugger
  - qa-rads-tracker   # condicional, cargado por cualquiera de los anteriores

guardrails_globales:
  - "El Orquestador no escribe código — solo su propio archivo de estado en runs/"
  - "No saltarse pasos — el orden 1→2→3→4→5 es obligatorio"
  - "Pipeline idempotente — reiniciar con el mismo run-id continúa desde la fase pendiente"
  - "Rutas prohibidas para el Orquestador mismo: settings/**, Profiles/**, Drivers/**, *.prj"
