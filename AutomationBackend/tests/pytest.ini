[pytest]
addopts = -v -s
markers =
    smoke: pruebas críticas de humo, deben pasar siempre antes de un deploy
    regression: suite completa de regresión
    component: pruebas de un servicio/endpoint aislado
    e2e: flujos de negocio completos encadenando varios endpoints
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
